name: Build engine

# Builds eboot.bin (the engine shipped in the Otakio VPK) from this branch with the same VitaSDK toolchain as the
# published engine (the 2025-03-11 build, gcc 10.3), so anyone can check that it comes from this source. A tag named
# engine-* also publishes the build as a GitHub release.

on:
  push:
    branches: [otakio]
    tags: ["engine-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # VitaSDK autobuild of 2025-03-11 (vita-toolchain 77f17b9, gcc 10.3): the toolchain of the published engine.
  # Newer SDKs (gcc 14+) reject parts of lpp-vita's C code and would build a different binary.
  VITASDK_URL: https://github.com/vitasdk/autobuilds/releases/download/master-linux-v2.529/vitasdk-x86_64-linux-gnu-2025-03-11_15-12-52.tar.bz2
  VITASDK_SHA256: 4fd03f4a0b855584371cbed35e82356e2f5c1f74713ac95bce342e00bc7df6d5
  # NOBORU's libvita2d fork, the one Otakio's engine has always been built with
  LIBVITA2D_REPO: https://github.com/Creckeryop/libvita2d
  LIBVITA2D_COMMIT: fa05b65
  # vdpm packages, in the order the published engine's SDK got them (openssl-1.1.1 last: libcurl uses it for TLS 1.3)
  VDPM_PACKAGES: >-
    henkaku taihen libpng libjpeg-turbo freetype zlib zstd openssl curl libvita2d quirc libarchive onigmo libvorbis
    libogg bzip2 xz expat libmad libsndfile speexdsp mpg123 opus opusfile luajit libwebp mbedtls lame flac openssl-1.1.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: VitaSDK (2025-03-11)
        run: |
          curl -sSL -o vitasdk.tar.bz2 "$VITASDK_URL"
          echo "$VITASDK_SHA256  vitasdk.tar.bz2" | sha256sum -c -
          tar -xjf vitasdk.tar.bz2 -C "$HOME"
          rm vitasdk.tar.bz2
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Libraries (vdpm)
        run: |
          cat "$VITASDK/version_info.txt"
          for pkg in $VDPM_PACKAGES; do vdpm "$pkg" > /dev/null; done

      - name: libcurl against OpenSSL 1.1.1
        # vdpm's curl is built against OpenSSL 1.0.2 (TLS 1.2 at most): rebuilt with the vitasdk/packages recipe
        run: |
          curl -sSL -o curl.tar.gz "https://github.com/curl/curl/releases/download/curl-8_17_0/curl-8.17.0.tar.gz"
          echo "e8e74cdeefe5fb78b3ae6e90cd542babf788fa9480029cfcee6fd9ced42b7910  curl.tar.gz" | sha256sum -c -
          tar -xzf curl.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/curl-8.17.0" && mkdir build && cd build
          opts=(
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi"
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CURL_EXE=OFF -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DENABLE_IPV6=OFF
            -DCURL_DISABLE_SOCKETPAIR=ON -DHAVE_FCNTL_O_NONBLOCK=OFF -DENABLE_THREADED_RESOLVER=OFF -DBUILD_LIBCURL_DOCS=OFF
            -DBUILD_MISC_DOCS=OFF -DENABLE_CURL_MANUAL=OFF -DCURL_CA_BUNDLE="vs0:data/external/cert/CA_LIST.cer"
            -DCURL_USE_LIBPSL=OFF -DCURL_USE_OPENSSL=ON -DCMAKE_REQUIRED_FLAGS=-pthread
          )
          cmake .. "${opts[@]}" > /dev/null
          sed -i '/HAVE_PIPE2/d' lib/curl_config.h
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
          rm -f "$GITHUB_WORKSPACE/curl.tar.gz"

      - name: Check gzip in libcurl
        # Otakio asks for compressed transfers (CURLOPT_ACCEPT_ENCODING): libcurl must be built with zlib
        run: |
          "$VITASDK/bin/arm-vita-eabi-nm" "$VITASDK/arm-vita-eabi/lib/libcurl.a" 2>/dev/null | grep -q " U inflateInit2_" \
            || { echo "libcurl was built without zlib"; exit 1; }

      - name: dav1d and libavif (AVIF pages)
        run: |
          pip install --quiet meson==1.6.1 ninja==1.11.1.3
          cd "$RUNNER_TEMP"
          curl -sSL -o dav1d.tar.gz https://code.videolan.org/videolan/dav1d/-/archive/1.5.4/dav1d-1.5.4.tar.gz
          echo "a1d5b63d2d38ec9bd03acf643caa51fa22edd1e89c5a109c4807717216bbec07  dav1d.tar.gz" | sha256sum -c -
          tar -xzf dav1d.tar.gz
          cat > vita-cross.txt <<CROSS
          [binaries]
          c = '$VITASDK/bin/arm-vita-eabi-gcc'
          cpp = '$VITASDK/bin/arm-vita-eabi-g++'
          ar = '$VITASDK/bin/arm-vita-eabi-ar'
          strip = '$VITASDK/bin/arm-vita-eabi-strip'
          pkg-config = '$VITASDK/bin/arm-vita-eabi-pkg-config'
          [built-in options]
          c_args = ['-mcpu=cortex-a9', '-mfpu=neon', '-mfloat-abi=hard', '-O2', '-ffunction-sections', '-fdata-sections']
          [host_machine]
          system = 'vita'
          cpu_family = 'arm'
          cpu = 'cortex-a9'
          endian = 'little'
          CROSS
          sed -i 's/^          //' vita-cross.txt
          # static, without PIC: the Vita executable format has no GOT relocations
          meson setup dav1d-1.5.4/build dav1d-1.5.4 --cross-file vita-cross.txt --prefix="$VITASDK/arm-vita-eabi" \
            --default-library=static --buildtype=release -Db_staticpic=false -Denable_tools=false -Denable_tests=false \
            -Denable_examples=false -Dbitdepths=8 -Dlogging=false > /dev/null
          ninja -C dav1d-1.5.4/build install > /dev/null
          curl -sSL -o libavif.tar.gz https://github.com/AOMediaCodec/libavif/archive/refs/tags/v1.4.2.tar.gz
          echo "2b645287340ba5a631d268b551dc2d72bd73ac33335962dd36dcdb6d8366921d  libavif.tar.gz" | sha256sum -c -
          tar -xzf libavif.tar.gz
          sed -i 's/^set(CMAKE_POSITION_INDEPENDENT_CODE ON)/set(CMAKE_POSITION_INDEPENDENT_CODE OFF)/' libavif-1.4.2/CMakeLists.txt
          cmake -S libavif-1.4.2 -B libavif-1.4.2/build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DAVIF_CODEC_DAV1D=SYSTEM -DAVIF_LIBYUV=OFF -DAVIF_LIBSHARPYUV=OFF -DAVIF_LIBXML2=OFF -DAVIF_BUILD_APPS=OFF \
            -DAVIF_BUILD_TESTS=OFF -DAVIF_JPEG=OFF -DAVIF_ZLIBPNG=OFF -DCMAKE_C_FLAGS="-mcpu=cortex-a9 -mfpu=neon -O2" > /dev/null
          make -C libavif-1.4.2/build -j"$(nproc)" install > /dev/null
          for lib in libdav1d.a libavif.a; do
            if "$VITASDK/bin/arm-vita-eabi-readelf" -r "$VITASDK/arm-vita-eabi/lib/$lib" | grep -qE "R_ARM_(BASE_PREL|GOT_BREL)"; then
              echo "$lib has GOT relocations"; exit 1
            fi
          done

      - name: Check TLS 1.3
        run: |
          pc="$VITASDK/arm-vita-eabi/lib/pkgconfig"
          grep "^Version" "$pc/openssl.pc" "$pc/libcurl.pc"
          # TLS 1.3: OpenSSL 1.1.1 under a libcurl built against it
          grep -q "^Version: 1\.1\.1" "$pc/openssl.pc" || { echo "OpenSSL 1.1.1 is required"; exit 1; }
          grep -aq "TLS_AES_256_GCM_SHA384" "$VITASDK/arm-vita-eabi/lib/libssl.a" || { echo "libssl has no TLS 1.3"; exit 1; }
          grep -aq "SSL_CTX_set_ciphersuites" "$VITASDK/arm-vita-eabi/lib/libcurl.a" || { echo "libcurl was not built against OpenSSL 1.1.1"; exit 1; }

      - name: Fetch libvita2d
        run: |
          git clone --quiet "$LIBVITA2D_REPO" .deps/libvita2d
          git -C .deps/libvita2d checkout --quiet "$LIBVITA2D_COMMIT"
          # Otakio: font files read through a block cache (see the patch header)
          git -C .deps/libvita2d apply "$GITHUB_WORKSPACE/libvita2d-otakio.patch"

      - name: Build
        run: |
          make -C .deps/libvita2d/libvita2d -j"$(nproc)"
          make -j"$(nproc)" V2D_DIR="$PWD/.deps/libvita2d/libvita2d"
          pc="$VITASDK/arm-vita-eabi/lib/pkgconfig"
          {
            echo "commit: $GITHUB_SHA"
            echo "vitasdk: $VITASDK_URL (sha256 $VITASDK_SHA256)"
            sed -n 1p "$VITASDK/version_info.txt"
            echo "gcc: $(arm-vita-eabi-gcc -dumpversion)"
            echo "libvita2d: $LIBVITA2D_REPO @ $LIBVITA2D_COMMIT + libvita2d-otakio.patch"
            echo "dav1d: 1.5.4, libavif: 1.4.2"
            grep "^Version" "$pc/openssl.pc" | sed "s/^Version/openssl/"
            grep "^Version" "$pc/libcurl.pc" | sed "s/^Version/libcurl/"
          } > build-info.txt

      - name: Checksums
        run: |
          sha256sum eboot_unsafe.bin eboot_safe.bin | tee SHA256SUMS
          cat build-info.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otakio-engine-${{ github.sha }}
          path: |
            eboot_unsafe.bin
            eboot_safe.bin
            lpp-vita.elf.unstripped.elf
            SHA256SUMS
            build-info.txt
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/engine-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otakio-engine-${{ github.sha }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Otakio engine $GITHUB_REF_NAME" \
            --notes "eboot.bin built by the Build engine workflow from $GITHUB_SHA. See build-info.txt for the toolchain." \
            eboot_unsafe.bin eboot_safe.bin lpp-vita.elf.unstripped.elf SHA256SUMS build-info.txt

  # Dependabot's updates of the pinned actions merge themselves once the job above passes (minor and patch versions
  # only: a major version waits for a person), so the workflows keep working while nobody maintains the repository
  automerge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR" --squash --delete-branch --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
