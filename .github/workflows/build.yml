name: Build engine

# Builds eboot.bin (the engine shipped in the Otakio VPK) from this branch with the same VitaSDK toolchain as the
# published engine (the 2025-03-11 build, gcc 10.3), so anyone can check that it comes from this source. A tag named
# engine-* also publishes the build as a GitHub release.

on:
  push:
    branches: [otakio]
    tags: ["engine-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # VitaSDK autobuild of 2025-03-11 (vita-toolchain 77f17b9, gcc 10.3): the toolchain of the published engine.
  # Newer SDKs (gcc 14+) reject parts of lpp-vita's C code and would build a different binary.
  VITASDK_URL: https://github.com/vitasdk/autobuilds/releases/download/master-linux-v2.529/vitasdk-x86_64-linux-gnu-2025-03-11_15-12-52.tar.bz2
  VITASDK_SHA256: 4fd03f4a0b855584371cbed35e82356e2f5c1f74713ac95bce342e00bc7df6d5
  # NOBORU's libvita2d fork, the one Otakio's engine has always been built with
  LIBVITA2D_REPO: https://github.com/Creckeryop/libvita2d
  LIBVITA2D_COMMIT: fa05b65
  # vdpm packages, in the order the published engine's SDK got them (openssl-1.1.1 last: libcurl uses it for TLS 1.3)
  VDPM_PACKAGES: >-
    henkaku taihen libpng libjpeg-turbo freetype zlib zstd openssl curl libvita2d quirc libarchive onigmo libvorbis
    libogg bzip2 xz expat libmad libsndfile speexdsp mpg123 opus opusfile luajit libwebp mbedtls lame flac openssl-1.1.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: VitaSDK (2025-03-11)
        run: |
          curl -sSL -o vitasdk.tar.bz2 "$VITASDK_URL"
          echo "$VITASDK_SHA256  vitasdk.tar.bz2" | sha256sum -c -
          tar -xjf vitasdk.tar.bz2 -C "$HOME"
          rm vitasdk.tar.bz2
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Libraries (vdpm)
        run: |
          cat "$VITASDK/version_info.txt"
          for pkg in $VDPM_PACKAGES; do vdpm "$pkg" > /dev/null; done

      - name: libcurl against OpenSSL 1.1.1
        # vdpm's curl is built against OpenSSL 1.0.2 (TLS 1.2 at most): rebuilt with the vitasdk/packages recipe
        run: |
          curl -sSL -o curl.tar.gz "https://github.com/curl/curl/releases/download/curl-8_17_0/curl-8.17.0.tar.gz"
          echo "e8e74cdeefe5fb78b3ae6e90cd542babf788fa9480029cfcee6fd9ced42b7910  curl.tar.gz" | sha256sum -c -
          tar -xzf curl.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/curl-8.17.0" && mkdir build && cd build
          opts=(
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi"
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CURL_EXE=OFF -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DENABLE_IPV6=OFF
            -DCURL_DISABLE_SOCKETPAIR=ON -DHAVE_FCNTL_O_NONBLOCK=OFF -DENABLE_THREADED_RESOLVER=OFF -DBUILD_LIBCURL_DOCS=OFF
            -DBUILD_MISC_DOCS=OFF -DENABLE_CURL_MANUAL=OFF -DCURL_CA_BUNDLE="vs0:data/external/cert/CA_LIST.cer"
            -DCURL_USE_LIBPSL=OFF -DCURL_USE_OPENSSL=ON -DCMAKE_REQUIRED_FLAGS=-pthread
          )
          cmake .. "${opts[@]}" > /dev/null
          sed -i '/HAVE_PIPE2/d' lib/curl_config.h
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
          rm -f "$GITHUB_WORKSPACE/curl.tar.gz"

      - name: Check TLS 1.3
        run: |
          pc="$VITASDK/arm-vita-eabi/lib/pkgconfig"
          grep "^Version" "$pc/openssl.pc" "$pc/libcurl.pc"
          # TLS 1.3: OpenSSL 1.1.1 under a libcurl built against it
          grep -q "^Version: 1\.1\.1" "$pc/openssl.pc" || { echo "OpenSSL 1.1.1 is required"; exit 1; }
          grep -aq "TLS_AES_256_GCM_SHA384" "$VITASDK/arm-vita-eabi/lib/libssl.a" || { echo "libssl has no TLS 1.3"; exit 1; }
          grep -aq "SSL_CTX_set_ciphersuites" "$VITASDK/arm-vita-eabi/lib/libcurl.a" || { echo "libcurl was not built against OpenSSL 1.1.1"; exit 1; }

      - name: Fetch libvita2d
        run: |
          git clone --quiet "$LIBVITA2D_REPO" .deps/libvita2d
          git -C .deps/libvita2d checkout --quiet "$LIBVITA2D_COMMIT"

      - name: Build
        run: |
          make -C .deps/libvita2d/libvita2d -j"$(nproc)"
          make -j"$(nproc)" V2D_DIR="$PWD/.deps/libvita2d/libvita2d"
          pc="$VITASDK/arm-vita-eabi/lib/pkgconfig"
          {
            echo "commit: $GITHUB_SHA"
            echo "vitasdk: $VITASDK_URL (sha256 $VITASDK_SHA256)"
            sed -n 1p "$VITASDK/version_info.txt"
            echo "gcc: $(arm-vita-eabi-gcc -dumpversion)"
            echo "libvita2d: $LIBVITA2D_REPO @ $LIBVITA2D_COMMIT"
            grep "^Version" "$pc/openssl.pc" | sed "s/^Version/openssl/"
            grep "^Version" "$pc/libcurl.pc" | sed "s/^Version/libcurl/"
          } > build-info.txt

      - name: Checksums
        run: |
          sha256sum eboot_unsafe.bin eboot_safe.bin | tee SHA256SUMS
          cat build-info.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otakio-engine-${{ github.sha }}
          path: |
            eboot_unsafe.bin
            eboot_safe.bin
            SHA256SUMS
            build-info.txt
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/engine-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otakio-engine-${{ github.sha }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Otakio engine $GITHUB_REF_NAME" \
            --notes "eboot.bin built by the Build engine workflow from $GITHUB_SHA. See build-info.txt for the toolchain." \
            eboot_unsafe.bin eboot_safe.bin SHA256SUMS build-info.txt
