name: Build engine

# Builds eboot.bin (the engine shipped in the Otakio VPK) from this branch, in the official VitaSDK Docker image,
# so anyone can check that the published engine comes from this source. A tag named engine-* also publishes the build
# as a GitHub release.

on:
  push:
    branches: [otakio]
    tags: ["engine-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # VitaSDK 2026.08 (build of 2026-10-29), pinned by digest so the toolchain doesn't change under the build
  VITASDK_IMAGE: vitasdk/vitasdk:2026.08-20261029@sha256:acd15285e1ae473e925c6f83fa41e2de45eb8b9e8ba89be7df03e194c35c11d3
  # NOBORU's libvita2d fork, the one Otakio's engine has always been built with
  LIBVITA2D_REPO: https://github.com/Creckeryop/libvita2d
  LIBVITA2D_COMMIT: fa05b65
  # vdpm packages the engine links with; openssl-1.1.1 + curl give TLS 1.3
  VDPM_PACKAGES: zlib bzip2 zstd libsndfile speexdsp mpg123 opus opusfile luajit libwebp lame flac libogg libvorbis openssl-1.1.1 curl

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch libvita2d
        run: |
          git clone --quiet "$LIBVITA2D_REPO" .deps/libvita2d
          git -C .deps/libvita2d checkout --quiet "$LIBVITA2D_COMMIT"

      - name: Build in the VitaSDK image
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VDPM_PACKAGES -e VITASDK_IMAGE -e LIBVITA2D_COMMIT "$VITASDK_IMAGE" bash -ec '
            echo "VitaSDK: $(cat "$VITASDK/version_info.txt" 2>/dev/null || echo unknown)"
            vdpm $VDPM_PACKAGES
            # TLS 1.3 needs OpenSSL 1.1.1 under libcurl
            pc="$VITASDK/arm-vita-eabi/lib/pkgconfig"
            echo "openssl $(grep "^Version" "$pc/openssl.pc")"
            echo "libcurl $(grep "^Version" "$pc/libcurl.pc")"
            grep -q "^Version: 1\.1\.1" "$pc/openssl.pc" || { echo "OpenSSL 1.1.1 is required (TLS 1.3)"; exit 1; }
            grep -aq "TLS_AES_256_GCM_SHA384" "$VITASDK/arm-vita-eabi/lib/libssl.a" || { echo "libssl has no TLS 1.3 ciphers"; exit 1; }
            make -C .deps/libvita2d/libvita2d -j"$(nproc)"
            make -j"$(nproc)" V2D_DIR=/src/.deps/libvita2d/libvita2d
            {
              echo "image: $VITASDK_IMAGE"
              echo "vitasdk: $(cat "$VITASDK/version_info.txt" 2>/dev/null || echo unknown)"
              echo "libvita2d: $LIBVITA2D_COMMIT"
              echo "$(grep "^Version" "$pc/openssl.pc" | sed "s/Version/openssl/")"
              echo "$(grep "^Version" "$pc/libcurl.pc" | sed "s/Version/libcurl/")"
            } > build-info.txt
            # the container runs as root: let the runner add to these files
            chmod a+rw build-info.txt eboot_unsafe.bin eboot_safe.bin
          '

      - name: Checksums
        run: |
          echo "commit: $GITHUB_SHA" >> build-info.txt
          sha256sum eboot_unsafe.bin eboot_safe.bin | tee SHA256SUMS
          cat build-info.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otakio-engine-${{ github.sha }}
          path: |
            eboot_unsafe.bin
            eboot_safe.bin
            SHA256SUMS
            build-info.txt
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/engine-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otakio-engine-${{ github.sha }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Otakio engine $GITHUB_REF_NAME" \
            --notes "eboot.bin built by the Build engine workflow from $GITHUB_SHA. See build-info.txt for the toolchain." \
            eboot_unsafe.bin eboot_safe.bin SHA256SUMS build-info.txt
